spring.application.name=FindBack
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/findback?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
application.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
application.jwt.expiration=86400000

# File Upload Configuration
app.upload.dir=uploads
app.upload.base-url=/api/images

# Matching Configuration
app.match.threshold=40
